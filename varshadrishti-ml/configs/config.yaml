data:
    dataset_id: "3RIMG_L1B_STD"
    rainfall_dataset_id: "3RIMG_L2B_IMC"

    sequence_length: null
    image_size: null

    channels: []

    roi:
        min_lat: null
        max_lat: null
        min_lon: null
        max_lon: null

preprocessing:
    normalization: null
    resize_method: null
    missing_value_strategy: null

